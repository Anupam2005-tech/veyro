        '400':
          description: Request or provider signature is invalid.
        '401':
          description: Firebase authentication required.
        '403':
          description: App Check, account or role authorization denied.
        '404':
          description: Resource unavailable or not owned by the caller.
        '409':
          description: State conflict, outstanding balance or reconciliation required.
        '503':
          description: Provider or configuration unavailable.
      parameters:
      - name: X-Razorpay-Signature
        in: header
        required: true
        schema:
          type: string
      - name: X-Razorpay-Event-Id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
