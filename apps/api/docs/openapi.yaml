      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - attemptId
              - razorpay_order_id
              - razorpay_payment_id
              - razorpay_signature
              properties:
                attemptId:
                  type: string
                razorpay_order_id:
                  type: string
                razorpay_payment_id:
                  type: string
                razorpay_signature:
                  type: string
