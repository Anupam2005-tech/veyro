components:
  securitySchemes:
    firebaseAuth: {type: http, scheme: bearer, bearerFormat: Firebase ID token}
    firebaseAppCheck: {type: apiKey, in: header, name: X-Firebase-AppCheck}
  schemas:
    ApiError:
      type: object
      required: [success, message, error, meta]
      properties:
        success: {type: boolean, enum: [false]}
        message: {type: string}
        error:
          type: object
          required: [code, details]
          properties:
            code: {type: string}
            details:
              type: array
              items:
                type: object
                required: [message]
                properties:
                  field: {type: string}
                  message: {type: string}
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: {type: string}
