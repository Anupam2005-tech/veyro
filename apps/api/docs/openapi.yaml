openapi: 3.0.3
info:
  title: Veyro API
  version: 1.0.0
  description: Implemented HTTP operations. Planned domain routes are listed separately for contract review.
servers:
  - url: ../../..
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check API liveness
      description: Public, read-only liveness probe. No roles, request body, filters or pagination. Does not check external services.
      security: []
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          description: Optional caller-supplied correlation ID.
          schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,128}$'}
          example: demo-health
      responses:
        '200':
          description: API process is serving requests.
          headers:
            X-Request-Id: {schema: {type: string}, description: Correlation ID included in response metadata.}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string}
                  data:
                    type: object
                    required: [status, service, version, timestamp]
                    properties:
                      status: {type: string, enum: [UP]}
                      service: {type: string, enum: [veyro-api]}
                      version: {type: string}
                      timestamp: {type: string, format: date-time}
                  meta:
                    type: object
                    required: [requestId]
                    properties:
                      requestId: {type: string}
              example:
                success: true
                message: Veyro API is healthy and operational
                data: {status: UP, service: veyro-api, version: 1.0.0, timestamp: '2026-11-22T12:00:00.000Z'}
                meta: {requestId: demo-health}
        default:
          description: Shared API errors include invalid JSON (400, INVALID_JSON), oversized input (413, PAYLOAD_TOO_LARGE), unsupported encoding (415, UNSUPPORTED_MEDIA_TYPE) and unexpected failures (500, INTERNAL_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/session:
    post:
      operationId: bootstrapSession
      summary: Create or synchronize the signed-in user's profile
      description: Requires a Firebase ID token and a fresh limited-use App Check token per request. Retries with a fresh token reuse the same profile. No prior product role is required.
      security:
        - firebaseAuth: []
          firebaseAppCheck: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleIntent: {type: string, nullable: true, enum: [customer, driver, null]}
            example: {roleIntent: customer}
      responses:
        '200':
          description: Active profile for the authenticated UID.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, meta]
                properties:
                  success: {type: boolean, enum: [true]}
                  message: {type: string}
                  data:
                    type: object
                    required: [uid, role, roles, fullName, phone, onboardingComplete, updatedAt]
                    properties:
                      uid: {type: string}
                      role: {type: string, enum: [CUSTOMER, DRIVER, ADMIN]}
                      roles: {type: array, items: {type: string, enum: [CUSTOMER, DRIVER, ADMIN]}}
                      fullName: {type: string}
                      phone: {type: string}
                      onboardingComplete: {type: boolean}
                      updatedAt: {type: string, format: date-time}
                  meta:
                    type: object
                    required: [requestId]
                    properties:
                      requestId: {type: string}
              example:
                success: true
                message: Session ready.
                data: {uid: demo-user, role: CUSTOMER, roles: [CUSTOMER], fullName: '', phone: '', onboardingComplete: false, updatedAt: '2026-11-22T12:00:00Z'}
                meta: {requestId: demo-session}
        '400':
          description: Unsupported role intent or malformed JSON.
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
        '401':
          description: Missing or invalid Firebase authentication (UNAUTHENTICATED).
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
        '403':
          description: Invalid or consumed App Check token (APP_CHECK_FAILED), or inactive profile (PROFILE_UNAVAILABLE).
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
        '500':
          description: Unexpected provider or storage error (INTERNAL_ERROR).
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
  /api/v1/payments/orders:
    post:
      summary: Create or resume the single Test Mode order for an owned payable
      operationId: postApiV1PaymentsOrders
      security:
      - firebaseAuth: []
        firebaseAppCheck: []
      responses:
        '200':
          description: Operation completed in the standard success envelope.
        '400':
          description: Request or provider signature is invalid.
        '401':
          description: Firebase authentication required.
        '403':
          description: App Check, account or role authorization denied.
        '404':
          description: Resource unavailable or not owned by the caller.
        '409':
          description: State conflict, outstanding balance or reconciliation required.
        '503':
          description: Provider or configuration unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - invoiceId
              properties:
                invoiceId:
                  type: string
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/payments/status:
    post:
      summary: Check an owned invoice against the current Razorpay payment state
      operationId: postApiV1PaymentsStatus
      description: Checks the linked order without creating another one. A provider-confirmed capture can settle the invoice.
      security:
      - firebaseAuth: []
        firebaseAppCheck: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId]
              properties:
                invoiceId:
                  type: string
      responses:
        '200':
          description: Current payment state in the standard success envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [READY, PENDING, FAILED, CAPTURED, DISPUTED, REVIEW_REQUIRED]
        '400':
          description: Invalid invoice ID.
        '401':
          description: Firebase authentication required.
        '403':
          description: App Check, account or role authorization denied.
        '404':
          description: Invoice unavailable or not owned by the caller.
        '409':
          description: Order creation is being reconciled or payment requires review.
        '503':
          description: Payment provider unavailable.
  /api/v1/payments/verify:
    post:
      summary: Verify Checkout signature and fetch captured payment status
      operationId: postApiV1PaymentsVerify
      security:
