        '404':
          description: Resource unavailable or not owned by the caller.
        '409':
          description: State conflict, outstanding balance or reconciliation required.
        '503':
          description: Provider or configuration unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - attemptId
              - razorpay_order_id
              - razorpay_payment_id
              - razorpay_signature
              properties:
                attemptId:
                  type: string
                razorpay_order_id:
                  type: string
                razorpay_payment_id:
                  type: string
                razorpay_signature:
                  type: string
  /api/v1/payments/webhooks/razorpay:
    post:
      summary: Verify original webhook bytes and process provider-confirmed payments
      operationId: postApiV1PaymentsWebhooksRazorpay
      security: []
      responses:
        '200':
