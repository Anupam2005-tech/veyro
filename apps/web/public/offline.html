<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030407" />
    <title>Veyro — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #030407; color: #f2f4fa; font-family: Inter, system-ui, sans-serif; }
      main { width: min(32rem, calc(100vw - 2rem)); padding: 2rem; border: 1px solid rgba(170,176,196,.22); border-radius: 1.25rem; background: rgba(170,176,196,.08); }
      p { color: #aab0c4; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; border-radius: 999px; background: #b8f23a; color: #030407; padding: 0 1.25rem; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Veyro could not reach the server. Reconnect and try again. Live trip tracking and payments need an active connection.</p>
      <a href="/">Back to Veyro</a>
    </main>
  </body>
</html>
